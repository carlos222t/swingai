<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwingAI · Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-container">
  <div style="display:flex;justify-content:center;">
    <span class="brand-logo-chip"><span class="brand-logo-wrap"><img src="assets/logo.png" alt="SwingAI" class="brand-logo"></span></span>
  </div>

  <div class="auth-card">
    <div class="page-title" style="text-align:center;">Welcome back</div>
    <div class="page-sub" style="text-align:center;">Sign in to keep tracking your setups.</div>

    <form class="auth-form" id="signinForm">
      <div class="auth-field">
        <label class="auth-label" for="identifier">Email or username</label>
        <input class="auth-input" type="text" id="identifier" name="identifier" placeholder="you@example.com" autocomplete="username" required>
      </div>
      <div class="auth-field">
        <label class="auth-label" for="password">Password</label>
        <input class="auth-input" type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" required>
      </div>

      <div class="auth-error" id="signinError" hidden></div>

      <button type="submit" class="auth-submit" id="signinBtn">Sign in</button>
    </form>

    <div class="auth-switch">Don't have an account? <a href="signup">Sign up</a></div>

    <div class="auth-divider"><span>or</span></div>
    <a href="trending" class="auth-guest-link">Continue as a guest</a>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/signin.js"></script>
</body>
</html>
