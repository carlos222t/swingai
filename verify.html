<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwingAI · Confirm Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-container">
  <div style="display:flex;justify-content:center;">
    <span class="brand-logo-chip"><span class="brand-logo-wrap"><img src="assets/logo.png" alt="SwingAI" class="brand-logo"></span></span>
  </div>

  <div class="auth-card">
    <div class="page-title" style="text-align:center;">Confirm your email</div>
    <div class="page-sub" style="text-align:center;" id="pageSub">We'll send a 6-digit code to <span id="emailDisplay" class="mono"></span>.</div>

    <form class="auth-form" id="sendForm">
      <div class="auth-error" id="sendError" hidden></div>
      <button type="submit" class="auth-submit" id="sendBtn">Send code</button>
    </form>

    <form class="auth-form" id="verifyForm" hidden>
      <div class="auth-field">
        <label class="auth-label" for="code">Verification code</label>
        <input class="auth-input mono" type="text" id="code" name="code" placeholder="6-digit code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>
      </div>

      <div class="auth-error" id="verifyError" hidden></div>

      <button type="submit" class="auth-submit" id="verifyBtn">Verify &amp; create account</button>
      <button type="button" class="text-btn" id="resendBtn">Resend code</button>
    </form>

    <div id="successStage" hidden>
      <div class="page-title" style="text-align:center;">You're in!</div>
      <div class="page-sub" style="text-align:center;">Your account is set up. Next, pick a plan.</div>
      <a href="subscription" class="auth-submit" style="display:block;text-align:center;text-decoration:none;margin-top:20px;">Continue to plans</a>
    </div>

    <div class="auth-switch" id="signinSwitch"><a href="signup">Back to sign up</a></div>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/verify.js"></script>
</body>
</html>
