<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwingAI · Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-container">
  <div style="display:flex;justify-content:center;">
    <span class="brand-logo-chip"><span class="brand-logo-wrap"><img src="assets/logo.png" alt="SwingAI" class="brand-logo"></span></span>
  </div>

  <div class="page-title" style="text-align:center;margin-top:20px;" id="pageTitle">Create your account</div>
  <div class="page-sub" style="text-align:center;" id="pageSub">Sign up, then pick a plan.</div>

  <form class="auth-form" id="signupForm">
    <div class="auth-field">
      <label class="auth-label" for="username">Username</label>
      <input class="auth-input" type="text" id="username" name="username" placeholder="e.g. carlos222" autocomplete="username" required>
    </div>
    <div class="auth-field">
      <label class="auth-label" for="email">Email</label>
      <input class="auth-input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
    </div>
    <div class="auth-field">
      <label class="auth-label" for="password">Password</label>
      <input class="auth-input" type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
    </div>
    <div class="auth-field">
      <label class="auth-label" for="confirmPassword">Confirm password</label>
      <input class="auth-input" type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" minlength="8" required>
    </div>

    <div class="auth-error" id="signupError" hidden></div>

    <button type="submit" class="auth-submit" id="signupBtn">Continue</button>
  </form>

  <form class="auth-form" id="verifyForm" hidden>
    <div class="auth-field">
      <label class="auth-label" for="code">Verification code</label>
      <input class="auth-input mono" type="text" id="code" name="code" placeholder="6-digit code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>
    </div>

    <div class="auth-error" id="verifyError" hidden></div>

    <button type="submit" class="auth-submit" id="verifyBtn">Verify &amp; create account</button>
    <button type="button" class="text-btn" id="resendBtn">Resend code</button>
  </form>

  <div class="auth-switch" id="signinSwitch">Already have an account? <a href="signin.html">Sign in</a></div>
</div>

<script src="js/auth.js"></script>
<script src="js/signup.js"></script>
</body>
</html>
