<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwingAI · Premium Stocks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container container-wide">
  <div class="topbar">
    <div class="brand"><span class="brand-mark">S</span> SwingAI</div>
    <nav class="topnav">
      <a href="trending.html" class="topnav-link">Trending</a>
      <a href="premium.html" class="topnav-link active">Premium</a>
    </nav>
  </div>

  <div class="page-title">Premium Stocks</div>
  <div class="page-sub">Your own list. Add a ticker and we'll pull real price, volume and fundamentals for it &mdash; no screening.</div>

  <form class="add-ticker-form" id="addTickerForm">
    <input type="text" id="addTickerInput" class="add-ticker-input mono" placeholder="e.g. AAPL" maxlength="8" autocomplete="off" spellcheck="false">
    <button type="submit" class="add-ticker-btn">Add</button>
  </form>
  <div class="add-ticker-error" id="addTickerError" hidden></div>

  <div class="section-divider"></div>

  <div class="status-banner" id="statusBanner" hidden></div>

  <div class="screener-table-wrap" id="tableWrap" hidden>
    <table class="screener-table">
      <thead><tr id="premiumTableHead"></tr></thead>
      <tbody id="premiumTableBody"></tbody>
    </table>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/marketData.js"></script>
<script src="js/premium.js"></script>
</body>
</html>
