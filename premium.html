<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwingAI · Premium Stocks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container container-wide">
  <div class="topbar">
    <div class="brand"><span class="brand-logo-chip"><span class="brand-logo-wrap"><img src="assets/logo.png" alt="SwingAI" class="brand-logo"></span></span></div>
    <nav class="topnav">
      <a href="trending" class="topnav-link">Trending</a>
      <a href="premium" class="topnav-link active">Premium<span class="tier-badge" title="Premium plan required">&#128081;</span></a>
      <div class="profile-menu" id="profileMenu">
        <a href="signin" class="topnav-link" id="topbarAuthLink">Sign in</a>
        <div class="profile-dropdown" id="profileDropdown" hidden>
          <a href="subscription" class="profile-dropdown-item">Upgrade plan</a>
          <button type="button" class="profile-dropdown-item profile-dropdown-logout" id="logoutBtn">Log out</button>
        </div>
      </div>
    </nav>
  </div>

  <div class="page-title">Premium Stocks</div>
  <div class="page-sub">A hand-picked personal watchlist &mdash; no screening.</div>

  <div class="section-divider"></div>

  <div class="paywall" id="paywall" hidden>
    <div class="paywall-title">Premium Stocks is a Premium-plan feature</div>
    <div class="paywall-sub">Upgrade to see the hand-selected names we think are on the verge of a good trade.</div>
    <a href="subscription" class="plan-choose-btn" style="display:inline-block;text-decoration:none;margin-top:18px;">Upgrade to Premium</a>
  </div>

  <button type="button" class="save-stocks-btn" id="saveStocksBtn" hidden>Save changes</button>

  <div class="screener-table-wrap" id="tableWrap" hidden>
    <table class="screener-table">
      <thead><tr id="premiumTableHead"></tr></thead>
      <tbody id="premiumTableBody"></tbody>
    </table>
  </div>
</div>

<a href="upload" class="fab-upload" aria-label="Upload a trade">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  <span class="fab-badge" title="Basic plan or higher required">&#128142;</span>
</a>

<script src="js/auth.js"></script>
<script src="js/marketData.js"></script>
<script src="js/premium.js"></script>
<script src="js/topbarAuth.js"></script>
</body>
</html>
