<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwingAI · Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="ticker-tape"><div class="ticker-track" id="tickerTrack"></div></div>

<div class="container">
  <div class="topbar">
    <div class="brand"><span class="brand-mark">S</span> SwingAI</div>
    <div class="topbar-right">
      <div class="status-chip"><span class="status-dot"></span>Simulated market data</div>
    </div>
  </div>

  <div class="acct-header">
    <div class="acct-avatar">AI</div>
    <div class="acct-id">
      <div class="acct-name">AI Portfolio</div>
      <div class="acct-sub">Simulated positions, fake money, real prices.</div>
    </div>
  </div>

  <div class="portfolio-summary">
    <div class="ps-label">Total Portfolio Value</div>
    <div class="ps-value" id="pfValue"></div>
    <div class="ps-delta-row">
      <span class="ps-delta" id="pfDelta"></span>
      <span class="ps-sub" id="pfStartSub"></span>
    </div>
  </div>

  <div class="section-divider"></div>

  <div class="seg-tabs" id="acctTabs">
    <button type="button" data-tab="portfolio" class="active">Portfolio</button>
    <button type="button" data-tab="trades">Trades</button>
    <button type="button" data-tab="news">News</button>
  </div>

  <div id="tabPortfolio" class="acct-tab-panel">
    <div id="holdingsList"></div>
  </div>

  <div id="tabTrades" class="acct-tab-panel" hidden>
    <div id="tradesList"></div>
  </div>

  <div id="tabNews" class="acct-tab-panel" hidden>
    <div id="acctNewsList"></div>
  </div>

  <div class="footer-disclaimer">
    The AI Portfolio trades with simulated money only. Trades and reasoning are automated and can be wrong.
    Nothing here is investment advice.
  </div>
</div>

<div class="modal-backdrop" id="shareBackdrop" hidden>
  <div class="share-card">
    <button class="share-close" id="shareClose" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="share-card-inner" id="shareCardInner"></div>
    <button class="lv-btn lv-btn-primary" id="shareCopyBtn" type="button">Copy to share</button>
  </div>
</div>

<nav class="nav">

  <a href="active.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Active</a>
  <a href="study.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2.5H2z"/><path d="M22 4h-6a3 3 0 0 0-3 3v13a2.5 2.5 0 0 1 2.5-2.5H22z"/></svg>Study</a>
  <a href="portfolio.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>Portfolio</a>
</nav>

<script src="js/mockData.js"></script>
<script src="js/scoring.js"></script>
<script src="js/strategy.js"></script>
<script src="js/lessons.js"></script>
<script src="js/portfolio.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
