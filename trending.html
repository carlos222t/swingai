<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwingAI · Trending</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container container-wide">
  <div class="topbar">
    <div class="brand"><span class="brand-logo-chip"><span class="brand-logo-wrap"><img src="assets/logo.png" alt="SwingAI" class="brand-logo"></span></span></div>
    <nav class="topnav">
      <a href="trending" class="topnav-link active">Trending</a>
      <a href="premium" class="topnav-link">Premium<span class="tier-badge" title="Premium plan required">&#128081;</span></a>
      <div class="profile-menu" id="profileMenu">
        <a href="signin" class="topnav-link" id="topbarAuthLink">Sign in</a>
        <div class="profile-dropdown" id="profileDropdown" hidden>
          <a href="subscription" class="profile-dropdown-item">Upgrade plan</a>
          <button type="button" class="profile-dropdown-item profile-dropdown-logout" id="logoutBtn">Log out</button>
        </div>
      </div>
    </nav>
  </div>

  <div class="page-title">Trending</div>
  <div class="page-sub" id="trendModeSub">One combined screen: the 21 EMA sitting within 3% of price, either side.</div>

  <div class="section-divider"></div>

  <div class="screener-table-wrap" id="tableWrap" hidden>
    <table class="screener-table">
      <thead><tr id="trendTableHead"></tr></thead>
      <tbody id="trendTableBody"></tbody>
    </table>
  </div>

  <div class="criteria-footnote" id="trendCriteria"></div>
</div>

<a href="upload" class="fab-upload" aria-label="Upload a trade" style="position:relative;">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  <span class="fab-badge" title="Basic plan or higher required">&#128142;</span>
</a>

<script src="js/auth.js"></script>
<script src="js/marketData.js"></script>
<script src="js/trending.js"></script>
<script src="js/topbarAuth.js"></script>
</body>
</html>
